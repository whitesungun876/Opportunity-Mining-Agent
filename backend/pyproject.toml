[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "github-opportunity-miner-backend"
version = "0.1.0"
description = "Mock-first LangGraph backend for mining commercial opportunities from GitHub open-source projects."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langgraph>=0.2.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
observability = [
    "langfuse>=3.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
