default_profile: rag_evaluation

generic:
  description: Generic fallback profile for topics without a curated profile.
  default_per_query: 5
  default_max_issues: 24
  queries:
    - "{topic} production evaluation workflow type:issue"
    - "{topic} tracing observability debugging type:issue"
    - "{topic} enterprise permission security type:issue"
    - "{topic} ci regression dataset type:issue"
    - "{topic} integration workflow performance type:issue"
  quality_keywords:
    - production
    - deploy
    - deployment
    - evaluation
    - eval
    - dataset
    - regression
    - trace
    - tracing
    - observability
    - debug
    - integration
    - workflow
    - ci
    - security
    - permission
    - enterprise
    - performance
    - scale
    - latency
    - dashboard

